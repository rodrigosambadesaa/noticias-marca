plugins {
    id 'com.android.application'
}

android {
    namespace 'com.example.muyinteresante'
    compileSdkVersion 35

    defaultConfig {
        applicationId "com.rodrigosambade.noticias.marca"
        minSdkVersion 16
        targetSdkVersion 35
        versionCode 22
        versionName "1.6.2"
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    buildTypes {
        release {
            signingConfig signingConfigs.debug
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    lint {
        // The app intentionally remains on support-v7 for its existing API-16 UI.
        // ConnectivityAndInternetAccess keeps guarded API-21+/24+ fallbacks
        // for minSdk 16; the upstream helper intentionally centralizes them.
        disable 'GradleCompatible', 'WebpUnsupported', 'NewApi'
    }
}

dependencies {
    implementation 'com.github.bumptech.glide:glide:4.16.0'
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    implementation 'androidx.cardview:cardview:1.0.0'
    implementation 'androidx.swiperefreshlayout:swiperefreshlayout:1.1.0'
    implementation 'androidx.core:core:1.9.0'
    implementation 'androidx.lifecycle:lifecycle-viewmodel:2.6.2'
    implementation 'androidx.lifecycle:lifecycle-livedata:2.6.2'
    implementation 'org.jetbrains.kotlin:kotlin-stdlib-jdk7:1.8.10'
    implementation 'org.jetbrains.kotlin:kotlin-stdlib-jdk8:1.8.10'
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'net.sf.kxml:kxml2:2.3.0'
}
