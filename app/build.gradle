plugins {
    id 'com.android.application'
}

android {
    namespace 'com.example.muyinteresante'
    compileSdkVersion 35

    defaultConfig {
        applicationId "com.rodrigosambade.noticias.marca"
        minSdkVersion 16
        targetSdkVersion 35
        versionCode 14
        versionName "1.5.7"
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    buildTypes {
        release {
            signingConfig signingConfigs.debug
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    lint {
        // The app intentionally remains on support-v7 for its existing API-16 UI.
        // ConnectivityAndInternetAccess keeps guarded API-21+/24+ fallbacks
        // for minSdk 16; the upstream helper intentionally centralizes them.
        disable 'GradleCompatible', 'WebpUnsupported', 'NewApi'
    }
}

dependencies {
    implementation 'com.android.support:appcompat-v7:28.0.0'
    implementation 'com.android.support:recyclerview-v7:28.0.0'
    implementation 'com.android.support:cardview-v7:28.0.0'
    implementation 'com.android.support:design:28.0.0'
    implementation 'com.android.support:support-v4:28.0.0'
    testImplementation 'junit:junit:4.13.2'
}
